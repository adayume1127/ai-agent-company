name: Daily AI Content Draft

on:
  schedule:
    # 毎日 21:00 JST (UTC 12:00) に実行。GitHub Actions無料枠(パブリックリポジトリなら無制限、プライベートは月2,000分)で完結する
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai feedparser

      - name: Generate draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/generate_content.py

      - name: Commit draft
        run: |
          git config user.name "ai-employee-bot"
          git config user.email "ai-employee-bot@users.noreply.github.com"
          git add drafts/
          git commit -m "AI社員: 下書き自動生成" || echo "変更なし"
          git push
